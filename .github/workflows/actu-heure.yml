name: Actu monde (toutes les heures)
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot_actu_heure.py
        env:
          WEBHOOK_ACTU_HEURE: ${{ secrets.WEBHOOK_ACTU_HEURE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Sauvegarder les articles deja traites
        run: |
          git config user.name "actu-bot"
          git config user.email "actu-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "maj seen.json" && git push)
