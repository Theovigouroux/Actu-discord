name: Actu du jour
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot_actu_jour.py
        env:
          WEBHOOK_ACTU_JOUR: ${{ secrets.WEBHOOK_ACTU_JOUR }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
